[project]
name = "py-foliation"
version = "0.12"
description = "Change the page labels (the numbering a PDF viewer shows) of PDF documents"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Nicolas Vaughan", email = "nicolasvaughan@proton.me" }
]
requires-python = ">=3.15"
keywords = ["pdf", "page labels", "page numbers", "foliation", "pagination", "roman numerals", "folios"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Printing",
    "Topic :: Text Processing",
]
dependencies = [
    "pikepdf>=10.8",
]

[project.urls]
Homepage = "https://github.com/nivaca/py-foliation"
Source = "https://github.com/nivaca/py-foliation"
Mirror = "https://codeberg.org/nivaca/py-foliation"
Issues = "https://github.com/nivaca/py-foliation/issues"
Releases = "https://github.com/nivaca/py-foliation/releases"

[project.scripts]
py-foliation = "py_foliation:main"
py-foliation-install = "py_foliation.install:main"

[project.gui-scripts]
py-foliation-gui = "py_foliation.gui:main"

[project.optional-dependencies]
gui = [
    "pyside6-essentials>=6.10",
    "pyside6-pdf>=6.10",
]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
