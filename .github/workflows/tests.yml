name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v

  # A real install with installers/, as a user would run it, on the three
  # systems: the wheel built from this checkout (--from), without the window
  # (--no-gui, --no-menu); then the command and --uninstall.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir dist

      - name: Install, use and uninstall (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh installers/install.sh --from dist/*.whl --no-gui --no-menu
          "$HOME/.local/bin/py-foliation" --help
          sh installers/install.sh --uninstall
          test ! -e "$HOME/.local/bin/py-foliation"

      - name: Install, use and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\*.whl).FullName
          powershell -ExecutionPolicy ByPass -File installers\install.ps1 --from $wheel --no-gui --no-menu
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $cmd = Join-Path $env:LOCALAPPDATA "py-foliation\venv\Scripts\py-foliation.exe"
          & $cmd --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -ExecutionPolicy ByPass -File installers\install.ps1 --uninstall
          if (Test-Path $cmd) { exit 1 }

